<nav *ngIf="_userService.connected"  class="navbar navbar-light justify-content-between">
  <a class="">Connected as {{ account.email }}</a>

    <button (click)="logout()" class="btn btn-danger my-2 my-sm-0" type="submit">Log Out</button>
</nav>
<h3 *ngIf="this.message" class="text-center">{{this.message}}</h3>
<h1 *ngIf="this.router.url=='/'" class="text-center">{{this.title}}</h1>
