<nav *ngIf="_userService.connected"  class="navbar navbar-expand-lg navbar-light justify-content-between">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item"> <a class="">Connected as {{ this.account.email }}</a></li>
    </ul>

    <form class="form-inline my-2 my-lg-0">
        <button (click)="logout()" class="btn btn-danger my-2 my-sm-0" type="submit">Log Out</button>
      </form>


  </div>
</nav>
<h3 *ngIf="this.message" class="text-center">{{this.message}}</h3>
<h1 *ngIf="this.router.url=='/'" class="text-center titrename">{{this.title}}</h1>
