<h2 class="text-center mb-5 title-custom">Enter 10 names of well-known characters, celebrities...</h2>
<div class="container justify-content-center">
<div class="justify-content-center">
  <!-- method 3 with cards  -->
  <div class="d-flex flex-row flex-wrap ">
      <div *ngFor="let perso of personnages" class="btn-group p-2 px-3 w-25 list-group-item-action" role="group"><button class="btn text-white btn-warning" >{{perso.nom}}</button><div class="btn-group" *ngIf="!this.joueur.readytostart" role="group"><button type="button" class="btn-danger btn ml-2" (click)="deletePerso(perso)">-</button></div></div>
  </div>
  <form class="text-center justify-content-center p-5" [formGroup]="registerForm" name="registerForm" (ngSubmit)="onSubmit()">

    <div class="input-group mb-4 ml-auto mr-auto justify-content-center ">
      <div class="input-group-prepend" *ngIf="!this.ready && !this.joueur.readytostart">
        <span class="input-group-text" >{{this.personnages.length}}/10</span>
      </div>
      <input   type="text" *ngIf="!this.ready && !this.joueur.readytostart" placeholder="Name" formControlName="nom" class=" form-control " [ngClass]="{ 'is-invalid': (submitted && f.nom.errors) || (submitted && this.erreurNbr) }" />

      <div class="input-group-append">
      <button type="submit" *ngIf="!this.ready && !this.joueur.readytostart"  class="btn btn-primary">add</button>
        <button *ngIf="this.ready && !this.joueur.readytostart" type="button" (click)="readytoplay()"  class="btn btn-primary ml-5" >I'm ready to play!</button>
        <button *ngIf="this.joueur.readytostart" type="button" (click)="readytoplay(true)"  class="btn btn-danger ml-5" >Cancel</button>
        <button *ngIf="this.ownercanstart" type="button" (click)="startthegame()"  class="btn btn-primary ml-5" >Let's play !</button>
      </div>
      <div *ngIf="submitted && f.nom.errors" class="invalid-feedback mb-4">
        <div *ngIf="f.nom.errors.required">A name is required</div>
        <div *ngIf="f.nom.errors.minlength">Name must be at least 2 characters</div>
        <div *ngIf="f.nom.errors.maxlength">Name must be a maximum of 20 characters</div>
      </div>
      <div *ngIf="submitted && this.erreurNbr" class="invalid-feedback mb-4">
        <div *ngIf="this.erreurNbr">You can't add more than 10 names</div>
      </div>

    </div>

  </form>
</div>
</div>
