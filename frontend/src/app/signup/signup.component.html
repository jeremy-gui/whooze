
        <section>

          <form class="text-center border border-light p-5" name="registerForm" [formGroup]="registerForm" (submit)="submit()">

            <p class="h4 mb-4">Sign up</p>


            <input id="username" formControlName="username" type="username" class="form-control mb-4" placeholder="Username" [ngClass]="registerForm.controls['username'].invalid ? 'is-invalid' : ''">
            <label
              class="text-danger"
              *ngIf="registerForm.controls['username'].hasError('required')"
            >
              Username is required!
            </label>
            <label
              class="text-danger"
              *ngIf="registerForm.controls['username'].hasError('minlength')"
            >
              Enter a valid username (min. 3 characters)!
            </label>
            <input id="email" formControlName="email" type="email" class="form-control mb-4" placeholder="E-mail" [ngClass]="registerForm.controls['email'].invalid ? 'is-invalid' : ''">
            <label class="text-danger" *ngIf="registerForm.controls['email'].hasError('required')">
              Email is Required!
            </label>

            <label
              class="text-danger"
              *ngIf="registerForm.controls['email'].hasError('email')"
            >
              Enter a valid email address!
            </label>

            <input type="password" formControlName="password" ng-minlength="6" name="password" id="defaultRegisterFormPassword" class="form-control mb-4" placeholder="Password" aria-describedby="defaultRegisterFormPasswordHelpBlock" required  [ngClass]="registerForm.controls['password'].invalid ? 'is-invalid' : ''" >
            <label class="col" [ngClass]="registerForm.controls['password'].hasError('required') || registerForm.controls['password'].hasError('minlength')  ? 'text-danger' : 'text-success'">
              <i class="material-icons">{{ registerForm.controls['password'].hasError('required') ||
              registerForm.controls['password'].hasError('minlength') ? 'cancel' :
                'check_circle' }}</i>
              Must be at least 8 characters!
            </label>
            <label class="col" [ngClass]="registerForm.controls['password'].hasError('required') || registerForm.controls['password'].hasError('hasNumber')  ? 'text-danger' : 'text-success'">
              <i class="material-icons">{{ registerForm.controls['password'].hasError('required') ||
              registerForm.controls['password'].hasError('hasNumber') ? 'cancel' :
                'check_circle' }}</i>
              Must contain at least 1 number!
            </label>

            <input placeholder="Confirm password" id="confirmPassword" formControlName="confirmPassword" type="password" class="form-control mb-4"
                   [ngClass]="registerForm.controls['confirmPassword'].invalid ? 'is-invalid' : ''">
            <label class="text-danger" *ngIf="registerForm.controls['confirmPassword'].hasError('required')">
              Password is Required!
            </label>
            <label class="text-danger" *ngIf="registerForm.controls['confirmPassword'].hasError('NoPassswordMatch')">
              Password do not match
            </label>

            <button [disabled]="registerForm.invalid" type="submit" class="btn btn-primary btn-block mb-4">Sign-up</button>
            <hr>

            <!-- Terms of service -->
           </form>
          <!-- Default form register -->

        </section>
        <!--Section: Live preview-->
