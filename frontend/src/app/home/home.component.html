<div *ngIf="!_userService.connected">
  <div>
  <button routerLink="login" type="button" class="btn btn-primary w-100">Login</button>
  <button routerLink="signup" type="button" class="btn btn-primary w-100">Sign-up</button>
  </div>
</div>

<div *ngIf="_userService.connected">
  <div>
    <button routerLink="chooseusername" [state]="{data: {'creategame' : true}}" type="button"  class="btn btn-primary w-100 mb-4">Create new game</button>
    <button routerLink="chooseusername" [state]="{data: {'joingame' : true}}" type="button"  class="btn btn-primary w-100">Join existing game</button>
  </div>
</div>
