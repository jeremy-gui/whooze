# The app and the API share one origin.
server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/(timesapp|api-token-auth|api-token-refresh|api-token-verify)(/|$) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        # The access token is part of WebSocket URLs: keep it out of the logs.
        access_log off;
    }

    # Angular routes all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
